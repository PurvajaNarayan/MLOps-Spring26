version: "3.8"

services:
  mlflow-server:
    image: python:3.10-slim
    command: >
      bash -c "pip install mlflow &&
               mlflow server
               --host 0.0.0.0
               --port 5001
               --backend-store-uri sqlite:///mlflow.db
               --default-artifact-root /mlflow/artifacts"
    ports:
      - "5001:5001"
    volumes:
      - mlflow-data:/mlflow

  flask-app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mlflow-server
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5001
    volumes:
      - ./config.yaml:/app/config.yaml

volumes:
  mlflow-data:
